[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-notification-service"
version = "0.1.0"
description = "A small, reliable internal HTTP notification delivery service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notification-service = "notification_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

